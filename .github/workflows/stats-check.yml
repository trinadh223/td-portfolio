name: Stats token check (temporary)
on:
  push:
    branches: [feat/portfolio-refresh-v2]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run stats script
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_STATS_TOKEN_FLUXGO: ${{ secrets.GH_STATS_TOKEN_FLUXGO }}
          GH_STATS_TOKEN_OMNI: ${{ secrets.GH_STATS_TOKEN_OMNI }}
        run: node scripts/fetch-git-stats.mjs
